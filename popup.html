<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaflet Mark View</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/icon48.png" width="28" height="28" alt=""><strong>Leaflet Mark View</strong></header>
  <p class="description">把网页正文带进你的阅读空间。</p>
  <button id="capturePage" class="primary" type="button">阅读当前网页</button>
  <button id="openReader" type="button">打开阅读器</button>
  <p id="captureStatus" role="status" aria-live="polite">正文会在本机转换为 Markdown。</p>
  <script src="popup.js"></script>
</body>
</html>
